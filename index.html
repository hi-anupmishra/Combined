<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funnel Command Center</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; min-height: 100vh; padding: 24px 16px; }
  .wrap { max-width: 600px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .topbar h1 { font-size: 20px; font-weight: 700; color: #0f172a; }
  .topbar p { font-size: 13px; color: #64748b; margin-top: 4px; }
  .badge { font-size: 12px; font-weight: 600; background: #dcfce7; color: #166534; padding: 4px 12px; border-radius: 20px; white-space: nowrap; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .card { border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden; background: white; transition: border-color 0.2s; }
  .card-header { display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer; background: white; transition: background 0.2s; user-select: none; }
  .card.na .card-header { cursor: default; }
  .icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-size: 14px; font-weight: 600; color: #0f172a; line-height: 1.3; }
  .card-sub { font-size: 12px; color: #64748b; margin-top: 2px; }
  .card-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .tag { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .tag-live { background: #dcfce7; color: #166534; }
  .tag-na { background: #f1f5f9; color: #94a3b8; }
  .chevron { font-size: 18px; color: #94a3b8; transition: transform 0.2s; display: inline-block; line-height: 1; }
  .card-detail { display: none; padding: 14px 18px 16px; border-top: 1px solid #e2e8f0; flex-direction: column; gap: 10px; }
  .card.open .card-detail { display: flex; }
  .creds-box { background: white; border-radius: 10px; border: 1px solid #e2e8f0; overflow: hidden; }
  .creds-title { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 12px; border-bottom: 1px solid #f1f5f9; }
  .cred-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #f8fafc; }
  .cred-label { font-size: 12px; color: #64748b; }
  .copy-btn { font-size: 11px; font-family: monospace; background: white; border: 1px solid #e2e8f0; border-radius: 6px; padding: 3px 10px; cursor: pointer; color: #1e293b; transition: color 0.2s; min-width: 80px; text-align: center; }
  .copy-btn.copied { color: #16a34a; }
  .note-box { font-size: 12px; color: #64748b; background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 12px; display: flex; gap: 6px; align-items: flex-start; }
  .open-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; align-self: flex-start; }
  .footer { margin-top: 20px; font-size: 11px; color: #cbd5e1; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>Funnel command center</h1>
      <p>Tap any funnel to open links &amp; credentials</p>
    </div>
    <span class="badge">6 live · 1 pending</span>
  </div>

  <div class="list" id="list"></div>
  <div class="footer">Click any credential to copy instantly</div>
</div>

<script>
const funnels = [
  { id:"wa", icon:"📲", color:"#16a34a", bg:"#dcfce7", title:"GMT / Expert reporting", sub:"Google Sheets tracker", url:"https://docs.google.com/spreadsheets/d/1oL0lg2KjaHH7uCwUi-xC3wrpK0BsM4ajxsjid3jyxuU/edit?pli=1&gid=1186136311#gid=1186136311", urlLabel:"Open sheet" },
  { id:"po", icon:"🩺", color:"#7c3aed", bg:"#ede9fe", title:"Program onboarding / Blood test / Doctor consult", sub:"Ops consultation dashboard", url:"https://script.google.com/a/macros/sova.health/s/AKfycbw8aUnKhwkSXAY6Eo-yVobV4Q-Csg-BPfcp2piP2R3d9RscMJ4f00mL1pgG9uibSVbs/exec", urlLabel:"Open dashboard", creds:[{label:"Username",value:"Anup"},{label:"Password",value:"Leadershipsova"}] },
  { id:"kit", icon:"📦", color:"#d97706", bg:"#fef3c7", title:"Kit onboarding / Kit pickup", sub:"Sova kit dashboard", url:"https://script.google.com/a/macros/sova.health/s/AKfycbzC7o8SIGX_wBeN5NHlYrLqIPd4Cq0UHXCOsHqVZhgEV4GEOUrnut8SHj21xruHILSxfA/exec", urlLabel:"Open dashboard", creds:[{label:"Username",value:"Leadership"},{label:"Password",value:"Leadershipsova"}] },
  { id:"email", icon:"✉️", color:"#2563eb", bg:"#dbeafe", title:"Email", sub:"Freshdesk analytics · Sova support responses", url:"https://sova-help.freshdesk.com/a/analytics/reports/MjIxMzUw/page/1", urlLabel:"Open Freshdesk report", creds:[{label:"ID",value:"support@sova.health"},{label:"Password",value:"Zaqxsw1234@#"}] },
  { id:"ivr", icon:"📋", color:"#0f766e", bg:"#ccfbf1", title:"IVR", sub:"Google Sheets tracker", url:"https://docs.google.com/spreadsheets/d/1agz-ZCF8q8cFKi0M4fsvzA0NMilbjy14odhUV19v2KM/edit?gid=304132603#gid=304132603", urlLabel:"Open sheet" },
  { id:"hp", icon:"❤️", color:"#be185d", bg:"#fce7f3", title:"Health profile", sub:"Google Sheets · tab: GMT Consult Done", url:"https://docs.google.com/spreadsheets/d/14D9Zx5Fjueb0HSTon4U5VM8Tz1gUZ6XVsrxN_T5c9OE/edit?gid=646698212#gid=646698212", urlLabel:"Open sheet", note:'Go to the "GMT Consult Done" tab after opening' },
  { id:"chat", icon:"💬", color:"#94a3b8", bg:"#f1f5f9", title:"Chats", sub:"No reporting configured yet", na:true },
];

const list = document.getElementById('list');

funnels.forEach(f => {
  const card = document.createElement('div');
  card.className = 'card' + (f.na ? ' na' : '');
  card.style.borderRadius = '14px';

  const canExpand = f.url || f.creds || f.note;

  // Header
  const header = document.createElement('div');
  header.className = 'card-header';
  header.innerHTML = `
    <div class="icon" style="background:${f.bg}">${f.icon}</div>
    <div class="card-body">
      <div class="card-title">${f.title}</div>
      <div class="card-sub">${f.sub}</div>
    </div>
    <div class="card-right">
      <span class="tag ${f.na ? 'tag-na' : 'tag-live'}">${f.na ? 'not set up' : 'live'}</span>
      ${canExpand ? '<span class="chevron" id="chev-'+f.id+'">⌄</span>' : ''}
    </div>`;

  // Detail
  const detail = document.createElement('div');
  detail.className = 'card-detail';

  if (f.creds) {
    let credsHtml = `<div class="creds-box"><div class="creds-title">Credentials</div>`;
    f.creds.forEach(c => {
      credsHtml += `<div class="cred-row"><span class="cred-label">${c.label}</span><button class="copy-btn" data-val="${c.value}">${c.value}</button></div>`;
    });
    credsHtml += `</div>`;
    detail.innerHTML += credsHtml;
  }

  if (f.note) {
    detail.innerHTML += `<div class="note-box" style="border-color:${f.bg}"><span style="color:${f.color};font-weight:700;font-size:13px">i</span>${f.note}</div>`;
  }

  if (f.url) {
    detail.innerHTML += `<a class="open-btn" href="${f.url}" target="_blank" style="background:${f.color}">${f.urlLabel} →</a>`;
  }

  detail.style.background = f.bg + '33';

  // Toggle
  if (canExpand) {
    header.addEventListener('click', () => {
      const isOpen = card.classList.contains('open');
      // close all
      document.querySelectorAll('.card.open').forEach(c => {
        c.classList.remove('open');
        c.style.borderColor = '#e2e8f0';
        const ch = c.querySelector('.chevron');
        if (ch) ch.style.transform = '';
      });
      if (!isOpen) {
        card.classList.add('open');
        card.style.borderColor = f.color;
        header.style.background = f.bg + '55';
        const ch = document.getElementById('chev-' + f.id);
        if (ch) ch.style.transform = 'rotate(180deg)';
      } else {
        header.style.background = 'white';
      }
    });
  }

  card.appendChild(header);
  card.appendChild(detail);
  list.appendChild(card);
});

// Copy buttons
document.addEventListener('click', e => {
  if (e.target.classList.contains('copy-btn')) {
    const val = e.target.dataset.val;
    navigator.clipboard.writeText(val).catch(() => {});
    e.target.textContent = '✓ copied';
    e.target.classList.add('copied');
    setTimeout(() => {
      e.target.textContent = val;
      e.target.classList.remove('copied');
    }, 1500);
  }
});
</script>
</body>
</html>
